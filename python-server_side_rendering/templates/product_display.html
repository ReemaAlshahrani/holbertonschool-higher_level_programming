<!doctype html>
<html lang="en">
<head>
    <title>Product Display</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Include shared header -->
    {% include 'header.html' %}
    
    <h1>Product Display</h1>

    <!-- Display error message if any error occurs -->
    {% if error %}
        <p class="error">{{ error }}</p>
    {% elif products %}
        <!-- Display products in a table format -->
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                    <tr>
                        <td>{{ product.name }}</td>
                        <td>{{ product.category }}</td>
                        <td>${{ product.price }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No products available.</p>
    {% endif %}

    <!-- Include shared footer -->
    {% include 'footer.html' %}
</body>
</html>
